<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Professionelle Illustration: sicherer Lagerbereich mit Fahrweg, Stapler, Paletten und Beschäftigtem in Warnkleidung">
  <title>Sicherheit im Lager und auf Verkehrswegen</title>
  <desc>Eine moderne Lagerhalle mit klar markiertem Staplerfahrweg, Regalen, Ladung, Beschäftigtem in Warnkleidung und einem sicher geführten Flurförderzeug. Die Szene zeigt getrennte Verkehrsflächen und freie Sichtachsen.</desc>
