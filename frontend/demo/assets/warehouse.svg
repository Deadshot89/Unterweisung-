    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a6078"/><stop offset="1" stop-color="#26384b"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9e1e8"/><stop offset="1" stop-color="#abb7c3"/></linearGradient>
    <linearGradient id="forklift" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2f79c8"/><stop offset="1" stop-color="#16497e"/></linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#edff65"/><stop offset="1" stop-color="#bfdc2d"/></linearGradient>
    <linearGradient id="pallet" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5a05c"/><stop offset="1" stop-color="#9b6835"/></linearGradient>
