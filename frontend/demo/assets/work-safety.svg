<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Professionelle Illustration: Beschäftigter prüft beschädigte Schutzausrüstung an einem sicheren Industriearbeitsplatz">
  <title>PSA prüfen und Mängel melden</title>
  <desc>Ein Beschäftigter mit Helm, Schutzbrille, Warnweste und Handschuhen prüft eine beschädigte Schutzbrille an einem industriellen Arbeitsplatz. Ein Warnsymbol und ein separater Ablagebehälter verdeutlichen, dass beschädigte PSA ausgesondert werden muss.</desc>
