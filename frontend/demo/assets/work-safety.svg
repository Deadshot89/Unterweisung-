    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6ff"/><stop offset=".52" stop-color="#dceafa"/><stop offset="1" stop-color="#c7d9ef"/></linearGradient>
    <linearGradient id="factory" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173454"/><stop offset="1" stop-color="#31587d"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".92"/><stop offset=".45" stop-color="#c9efff" stop-opacity=".72"/><stop offset="1" stop-color="#8bc9e8" stop-opacity=".6"/></linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd95a"/><stop offset=".58" stop-color="#ffb30f"/><stop offset="1" stop-color="#e78b00"/></linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1262b0"/><stop offset="1" stop-color="#073b72"/></linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e7ff63"/><stop offset="1" stop-color="#b9db28"/></linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5f7690"/><stop offset="1" stop-color="#24364a"/></linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f2740" flood-opacity=".2"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="scene"><rect x="20" y="20" width="1160" height="680" rx="38"/></clipPath>
  </defs>
