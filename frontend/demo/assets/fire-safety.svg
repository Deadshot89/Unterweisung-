<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Professionelle Illustration: Beschäftigte verlassen geordnet einen Industriebereich über einen gekennzeichneten Fluchtweg">
  <title>Brandschutz und Evakuierung</title>
  <desc>Zwei Beschäftigte bewegen sich in einer modernen Industriehalle geordnet zu einem beleuchteten Notausgang. Eine Alarmleuchte, Rauch im Hintergrund und ein klarer Fluchtweg verdeutlichen das richtige Verhalten im Brandfall.</desc>
