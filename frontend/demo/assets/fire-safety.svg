    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#37516d"/><stop offset="1" stop-color="#1c2c40"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe5ee"/><stop offset="1" stop-color="#aebdca"/></linearGradient>
    <linearGradient id="exit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d976"/><stop offset="1" stop-color="#0f9c4b"/></linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2ff72"/><stop offset="1" stop-color="#c9e837"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd447"/><stop offset=".5" stop-color="#ff7a18"/><stop offset="1" stop-color="#e83b17"/></linearGradient>
    <radialGradient id="alarm" cx="50%" cy="50%" r="50%"><stop stop-color="#fff4ef"/><stop offset=".35" stop-color="#ff6b5e"/><stop offset="1" stop-color="#d61f2c"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#101b2b" flood-opacity=".22"/></filter>
    <filter id="smoke"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="scene"><rect x="20" y="20" width="1160" height="680" rx="38"/></clipPath>
  </defs>
