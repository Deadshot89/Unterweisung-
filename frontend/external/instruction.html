<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unterweisung durchführen</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/learning-experience-v38.css">
  <script src="/config.js"></script>
  <style>
    body{background:#eef4f8;color:#172033}
    main.external-wrap{max-width:1280px;margin:0 auto;padding:26px}
    .external-shell{display:grid;grid-template-columns:1fr;gap:18px}
    .hero{background:linear-gradient(135deg,#0f6f8f,#155eef);color:#fff;border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(21,94,239,.22)}
    .hero h1{font-size:36px;line-height:1.15;margin:10px 0}.hero p{font-size:17px;margin:5px 0;color:rgba(255,255,255,.88)}
    .panel{background:#fff;border:1px solid #d7e3eb;border-radius:24px;box-shadow:0 14px 35px rgba(20,41,56,.12);padding:22px}.muted{color:#667085}
    .external-learning-panel{display:grid;gap:22px}.learning-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #e4eaf0;padding-top:18px}.learning-actions-group{display:flex;gap:10px;flex-wrap:wrap}
    .confirm-box{display:flex;gap:12px;align-items:flex-start;border:2px solid #bcd2ff;background:#f4f8ff;border-radius:18px;padding:16px;font-size:17px;font-weight:700}.confirm-box input{width:auto;margin-top:4px;transform:scale(1.25)}
    .external-confirm{box-shadow:none;background:#f8fbfd}.complete-btn{font-size:18px;padding:14px 22px;border-radius:16px}.progress{height:10px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-top:18px}.progress span{display:block;height:100%;background:#fff;transition:width .2s ease}.big-error{max-width:780px;margin:40px auto;background:#fff;border-radius:24px;padding:28px;border:1px solid #d7e3eb}.lang-chip{display:inline-flex;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:6px 10px;font-weight:800}.learning-image-modal{position:fixed;inset:0;background:rgba(3,12,20,.86);display:grid;place-items:center;padding:24px;z-index:9999;cursor:zoom-out}.learning-image-modal img{max-width:min(1400px,96vw);max-height:92vh;border-radius:18px;box-shadow:0 28px 80px rgba(0,0,0,.45)}
    @media(max-width:700px){main.external-wrap{padding:12px}.hero{padding:20px;border-radius:20px}.hero h1{font-size:28px}.panel{padding:16px;border-radius:18px}.learning-actions{flex-direction:column}.learning-actions-group{width:100%}.learning-actions-group>*{flex:1}}
  </style>
</head>
<body>
  <main class="external-wrap">
    <section class="panel" id="box"><h1>Unterweisung laden …</h1><p class="muted">Bitte warten.</p></section>
  </main>
  <script src="/learning-experience-v38.js"></script>
  <script src="/external/instruction-v38.js"></script>
</body>
</html>
