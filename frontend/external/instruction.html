<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unterweisung durchführen</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    main.external-wrap{max-width:1120px;margin:0 auto;padding:28px}
    .external-title{font-size:30px;margin:0 0 8px}.external-sub{font-size:16px;color:#667085;margin:0 0 20px}
    .step{border-left:5px solid #0f6f8f;background:#f6fbfd;border-radius:14px;padding:18px;margin:16px 0}
    .question{border:1px solid #dbe5ed;border-radius:18px;padding:18px;margin:16px 0;background:#fff}
    .question h3{font-size:20px;margin:0 0 14px}.answer{display:block;border:1px solid #d7e3eb;border-radius:14px;padding:14px 16px;margin:9px 0;font-size:18px;cursor:pointer;background:#f8fbfd}.answer input{width:auto;margin-right:10px;transform:scale(1.25)}
    .confirm-line{font-size:18px;display:block;margin:18px 0}.confirm-line input{width:auto;margin-right:10px;transform:scale(1.3)}
    pre.content{white-space:pre-wrap;background:#f8fbfd;color:#172033;border:1px solid #d7e3eb;border-radius:16px;padding:18px;font-size:16px;line-height:1.55;max-height:420px;overflow:auto}
    .result-ok{background:#ecfdf3;border-left-color:#12b76a}.result-bad{background:#fff1f3;border-left-color:#f04438}
  </style>
</head>
<body>
  <main class="external-wrap">
    <section class="card" id="box">
      <h1>Unterweisung laden …</h1>
      <p class="muted">Bitte warten.</p>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('t');
    const box = document.getElementById('box');
    let current = null;
    const startedAt = Date.now();
    function esc(s=''){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function langText(key){
      const l=current?.language||'de';
      const t={
        loading:{de:'Unterweisung laden …',en:'Loading instruction …',pl:'Ładowanie instruktażu …'},
        confirm:{de:'Ich bestätige, dass ich die Inhalte gelesen und verstanden habe.',en:'I confirm that I have read and understood the content.',pl:'Potwierdzam, że przeczytałem/przeczytałam i zrozumiałem/zrozumiałam treść.'},
        complete:{de:'Unterweisung abschließen',en:'Complete instruction',pl:'Zakończ instruktaż'},
        questions:{de:'Testfragen',en:'Test questions',pl:'Pytania testowe'},
        content:{de:'Inhalte',en:'Content',pl:'Treść'},
        template:{de:'Vorlage / Schulungsunterlage öffnen',en:'Open template / training material',pl:'Otwórz szablon / materiał szkoleniowy'},
        noQuestions:{de:'Für diese Unterweisung sind aktuell keine Testfragen hinterlegt. Es wird nur die Bestätigung gespeichert.',en:'There are currently no test questions for this instruction. Only the confirmation will be saved.',pl:'Obecnie nie ma pytań testowych do tego instruktażu. Zapisane zostanie tylko potwierdzenie.'}
      };
      return t[key]?.[l] || t[key]?.de || key;
    }
    async function load(){
      if(!token){ box.innerHTML='<h1>Kein gültiger Link</h1>'; return; }
      const res = await fetch('/api/external/' + encodeURIComponent(token));
      const data = await res.json();
      if(!res.ok){ box.innerHTML='<h1>Link nicht verfügbar</h1><p>'+esc(data.error||'Fehler')+'</p>'; return; }
      current=data;
      renderInstruction();
    }
    function renderInstruction(){
      const questions = current.questions || [];
      box.innerHTML = `<h1 class="external-title">${esc(current.instructionName)}</h1>
        <p class="external-sub">${esc(current.companyName||'')} · ${esc(current.recipientName||current.email||'')}</p>
        <div class="step"><b>${langText('content')}</b></div>
        <pre class="content">${esc(current.description||'')}</pre>
        ${current.templateUrl?`<p><a class="btn ghost" href="${esc(current.templateUrl)}" target="_blank" rel="noopener">${langText('template')}</a></p>`:''}
        <label class="confirm-line"><input type="checkbox" id="confirm"> ${langText('confirm')}</label>
        <div class="step"><b>${langText('questions')}</b> ${current.testRequired?`<span class="muted">Bestehen ab ${esc(current.passPercent||80)} %</span>`:''}</div>
        <div id="questionsBox">${questions.length ? questions.map(renderQuestion).join('') : `<p class="muted">${langText('noQuestions')}</p>`}</div>
        <p><button class="primary" style="font-size:18px;padding:14px 20px" onclick="complete()">${langText('complete')}</button></p>`;
    }
    function renderQuestion(q,idx){
      return `<div class="question"><h3>${idx+1}. ${esc(q.question)}</h3>${(q.options||[]).map((o,i)=>`<label class="answer"><input type="radio" name="q_${esc(q.id)}" value="${i}"> ${esc(o)}</label>`).join('')}</div>`;
    }
    function collectAnswers(){
      return (current.questions||[]).map(q=>{
        const checked=document.querySelector(`input[name="q_${CSS.escape(q.id)}"]:checked`);
        return checked ? {questionId:q.id, answerIndex:Number(checked.value)} : null;
      }).filter(Boolean);
    }
    async function complete(){
      if(!document.getElementById('confirm')?.checked) return alert('Bitte Bestätigung anhaken.');
      const questions=current.questions||[];
      const answers=collectAnswers();
      if(current.testRequired && questions.length && answers.length !== questions.length) return alert('Bitte alle Testfragen beantworten.');
      const res = await fetch('/api/external/' + encodeURIComponent(token), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmed:true,answers,durationMinutes:Math.max(1,Math.round((Date.now()-startedAt)/60000))})});
      const data = await res.json();
      if(!res.ok) return alert(data.error||'Fehler');
      if(data.passed===false){
        box.innerHTML = `<div class="step result-bad"><h1>Test nicht bestanden</h1><p>Ergebnis: ${esc(data.scorePercent)} %. Benötigt: ${esc(data.passPercent)} %.</p><p>Bitte den Link erneut öffnen und die Unterweisung noch einmal sorgfältig durchführen.</p></div>`;
        return;
      }
      box.innerHTML = `<div class="step result-ok"><h1>Abgeschlossen</h1><p>Die Unterweisung wurde gespeichert und ist bis <b>${esc(data.validUntil)}</b> gültig.</p><p>Das Ergebnis ist jetzt in der Admin-Website sichtbar.</p></div>`;
    }
    load();
  </script>
</body>
</html>
