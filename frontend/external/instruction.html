<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unterweisung durchführen</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
  <style>
    body{background:#eef4f8;color:#172033}
    main.external-wrap{max-width:1280px;margin:0 auto;padding:26px}
    .external-shell{display:grid;grid-template-columns:1fr;gap:18px}
    .hero{background:linear-gradient(135deg,#0f6f8f,#155eef);color:#fff;border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(21,94,239,.22)}
    .hero h1{font-size:36px;line-height:1.15;margin:0 0 10px}.hero p{font-size:17px;margin:5px 0;color:rgba(255,255,255,.88)}
    .stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.step-pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:12px;font-weight:800}.step-pill small{display:block;font-weight:600;opacity:.8;margin-top:4px}
    .reader-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(390px,.95fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid #d7e3eb;border-radius:24px;box-shadow:0 14px 35px rgba(20,41,56,.12);padding:20px}.panel h2{margin:0 0 12px;font-size:24px}.panel h3{margin:18px 0 10px;font-size:19px}.muted{color:#667085}.content-card{font-size:18px;line-height:1.7}.content-card p{margin:0 0 12px}.content-card ul{margin:10px 0 0;padding-left:24px}.content-card li{margin:8px 0}.pdf-frame{width:100%;height:720px;border:1px solid #d7e3eb;border-radius:18px;background:#f8fbfd}.template-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0}.confirm-box{border:2px solid #0f6f8f;background:#ecf8fb;border-radius:20px;padding:16px;font-size:18px;font-weight:700}.confirm-box input{width:auto;margin-right:10px;transform:scale(1.35)}
    .question{border:1px solid #dbe5ed;border-radius:22px;padding:20px;margin:18px 0;background:#fff}.question h3{font-size:22px;line-height:1.35;margin:0 0 16px}.answer{display:flex;gap:12px;align-items:flex-start;border:2px solid #d7e3eb;border-radius:18px;padding:16px 18px;margin:11px 0;font-size:19px;line-height:1.35;cursor:pointer;background:#f8fbfd}.answer:hover{border-color:#0f6f8f;background:#ecf8fb}.answer input{width:auto;margin-top:4px;transform:scale(1.35)}.answer-letter{min-width:34px;height:34px;border-radius:999px;background:#e7f1f5;color:#0b4f68;display:inline-grid;place-items:center;font-weight:900}.answer:has(input:checked){border-color:#155eef;background:#eef4ff}.answer:has(input:checked) .answer-letter{background:#155eef;color:#fff}
    .actions-sticky{position:sticky;bottom:0;background:rgba(238,244,248,.92);backdrop-filter:blur(10px);padding:14px 0;margin-top:8px}.complete-btn{font-size:20px;padding:16px 24px;border-radius:16px}.progress{height:12px;background:#e7eef5;border-radius:999px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#0f6f8f;width:0%}.notice2{background:#fff8e6;border-left:5px solid #f79009;border-radius:16px;padding:14px;margin:12px 0}.result-ok{background:#ecfdf3;border-left:7px solid #12b76a;border-radius:24px;padding:28px}.result-bad{background:#fff1f3;border-left:7px solid #f04438;border-radius:24px;padding:28px}.big-error{max-width:780px;margin:40px auto;background:#fff;border-radius:24px;padding:28px;border:1px solid #d7e3eb}.lang-chip{display:inline-flex;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:6px 10px;font-weight:800;margin-left:8px}.read-checklist{background:#f8fbfd;border-radius:18px;padding:14px}.read-checklist label{display:block;font-size:16px;font-weight:700;margin:10px 0;color:#172033}.read-checklist input{width:auto;margin-right:9px;transform:scale(1.2)}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.score-card{background:#fff;border:1px solid #d7e3eb;border-radius:18px;padding:14px}.score-card b{display:block;font-size:28px}.locked-note{background:#eef4ff;border-left:5px solid #155eef;border-radius:16px;padding:14px;margin:12px 0}
    @media(max-width:1050px){.reader-grid{grid-template-columns:1fr}.pdf-frame{height:560px}.stepbar,.score-grid{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}
    @media(max-width:700px){main.external-wrap{padding:14px}.hero{padding:20px;border-radius:22px}.stepbar,.score-grid{grid-template-columns:1fr}.question h3{font-size:20px}.answer{font-size:18px}.pdf-frame{height:460px}}
  </style>
</head>
<body>
  <main class="external-wrap">
    <section class="panel" id="box">
      <h1>Unterweisung laden …</h1>
      <p class="muted">Bitte warten.</p>
    </section>
  </main>
  <script src="/external/instruction.js"></script>

</body>
</html>
