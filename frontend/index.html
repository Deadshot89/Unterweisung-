<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unterweisungsmanager Online · v0.40</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login-gate-v44.css">
  <link rel="stylesheet" href="/portal-v040.css">
</head>
<body class="auth-pending">
  <header class="topbar app-shell-header portal-topbar">
    <div class="brand-wrap">
      <div class="brand">UM</div>
      <div class="title-block">
        <h1>Unterweisungsmanager</h1>
        <p>Digitales Unterweisungs- und Schulungsmanagement</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="userInfo" class="user-info professional-user">Nicht angemeldet</span>
      <button id="companySwitchAction" class="btn ghost" type="button" hidden>Firma wechseln</button>
      <a class="btn ghost logout-action" href="/.auth/logout">Abmelden</a>
    </div>
  </header>

  <main>
    <section id="companySelectionGate" class="company-selection-gate">
      <div class="card auth-pending-card"><h2>Anmeldung</h2><p class="muted">E-Mail und Passwort. Firmendaten werden erst nach erfolgreicher Anmeldung geladen.</p></div>
    </section>

    <section id="authenticatedApp" class="portal-shell" hidden>
      <aside class="portal-sidebar" aria-label="Hauptnavigation">
        <div class="portal-sidebar-heading">Arbeitsportal</div>
        <nav id="portalNavigation" aria-label="Bereiche" hidden></nav>
        <div id="portalUserCard" class="portal-user-card"></div>
      </aside>

      <div class="portal-main">
        <section class="system-strip">
          <span class="status-dot"></span>
          <strong>Systemstatus:</strong>
          <span>Betriebsbereit</span>
          <span class="strip-divider"></span>
          <span id="activeCompanyLabel">Keine Firma ausgewählt</span>
          <span class="strip-divider"></span>
          <span>Version <span id="appVersion">v0.40</span></span>
        </section>

        <div id="portalWorkspace">
          <section id="dashboard" class="view active"></section>
          <section id="work" class="view" hidden></section>
          <section id="learning" class="view" hidden></section>
          <section id="planning" class="view" hidden></section>
          <section id="proofs" class="view" hidden></section>
          <section id="reports" class="view" hidden></section>
          <section id="admin" class="view" hidden></section>
        </div>
      </div>
    </section>
  </main>

  <template id="card-template">
    <div class="card"></div>
  </template>

  <script src="/config.js"></script>
  <script src="/auth-login-v42.js"></script>
  <script src="/app.js"></script>
  <script src="/ui-dialog.js"></script>
  <script src="/company-settings-v15.js"></script>
  <script src="/external-fix-v12.js"></script>
  <script src="/employee-management-v18.js"></script>
  <script src="/user-management-v19.js"></script>
  <script src="/template-management-v21.js"></script>
  <script src="/test-question-management-v22.js"></script>
  <script src="/instruction-type-management-v23.js"></script>
  <script src="/planning-management-v24.js"></script>
  <script src="/status-worklist-v25.js"></script>
  <script src="/essentra-live-check-v26.js"></script>
  <script src="/essentra-defect-log-v27.js"></script>
  <script src="/manager-report-v28.js"></script>
  <script src="/proof-management-v29.js"></script>
  <script src="/reminder-center-v30.js"></script>
  <script src="/portal-shell.js"></script>
</body>
</html>
