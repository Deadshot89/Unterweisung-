name: Alte Azure-Preview #5 entfernen

on:
  push:
    branches:
      - cleanup-swa-preview-5

permissions:
  contents: read

jobs:
  close_stale_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Geschlossenen PR-Kontext für Azure bereitstellen
        env:
          STALE_PR_NUMBER: "5"
          STALE_PR_HEAD: "rc991-unified-learning-portal"
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const eventPath = process.env.GITHUB_EVENT_PATH;
          const event = JSON.parse(readFileSync(eventPath, 'utf8'));
          event.action = 'closed';
          event.number = Number(process.env.STALE_PR_NUMBER);
          event.pull_request = {
            number: Number(process.env.STALE_PR_NUMBER),
            head: { ref: process.env.STALE_PR_HEAD },
            base: { ref: 'main' }
          };
          writeFileSync(eventPath, JSON.stringify(event), 'utf8');
          console.log(`Azure-Close-Kontext auf PR #${event.pull_request.number} gesetzt.`);
          NODE

      - name: Azure-Preview von PR 5 schließen
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: "frontend"
