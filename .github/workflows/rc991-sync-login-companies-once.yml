name: RC991 Sync Unified Login To Companies Once

on:
  push:
    branches:
      - rc991-unified-learning-portal
    paths:
      - '.github/workflows/rc991-sync-login-companies-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified RC991 source
        uses: actions/checkout@v4
        with:
          ref: rc991-unified-learning-portal
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch company branches
        run: git fetch origin company/essentra-components company/kontur-werkzeugstahl

      - name: Sync exact login ownership and verify each company
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"

          sync_branch() {
            branch="$1"
            slug="$2"
            dir="/tmp/${slug}"
            rm -rf "$dir"
            git worktree add --detach "$dir" "origin/$branch"

            cp "$SOURCE/frontend/auth-login-v42.js" "$dir/frontend/auth-login-v42.js"
            cp "$SOURCE/tests/unified-login-shell-v42.test.js" "$dir/tests/unified-login-shell-v42.test.js"
            cp "$SOURCE/tests/employee-portal-contract.test.js" "$dir/tests/employee-portal-contract.test.js"

            TARGET="$dir" python - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['TARGET'])

          app_path = root / 'frontend/app.js'
          app = app_path.read_text(encoding='utf-8')
          if 'UMAuthLogin.render' not in app:
              start = app.index("function renderAuthenticationRequired(message=''){")
              end = app.index("\n\nfunction renderServiceUnavailable", start)
              replacement = """function renderAuthenticationRequired(message=''){
            state.apiAvailable = false;
            state.data = null;
            state.statusRows = [];
            state.users = [];
            state.companyId = null;
            setCoreWorkspaceVisible(false);
            const gate = $('companySelectionGate');
            if(gate) UMAuthLogin.render({target:gate,message});
            renderUserInfo(false);
            if(typeof updateCompanyShell === 'function') updateCompanyShell(null);
          }"""
              app = app[:start] + replacement + app[end:]
          app = app.replace('<a class="btn ghost" href="/.auth/logout">Abmelden</a>', '<a class="btn ghost logout-action" href="/.auth/logout">Abmelden</a>')
          if 'UMAuthLogin.render' not in app:
              raise SystemExit('shared login render missing')
          if 'Anmeldung erforderlich</h2>' in app or 'Sitzung abmelden' in app:
              raise SystemExit('legacy Microsoft-only login markup remains')
          app_path.write_text(app, encoding='utf-8')

          portal_path = root / 'frontend/employee-portal-v37.js'
          portal = portal_path.read_text(encoding='utf-8')
          portal = portal.replace('// v0.36.3 Mitarbeiterportal, Dual-Login und bildgestützte Lernschritte.', '// v0.36.3 Mitarbeiterportal und bildgestützte Lernschritte.', 1)
          if '  function renderUnifiedLogin' in portal:
              start = portal.index("  function renderUnifiedLogin(errorText=''){")
              end = portal.index('  function employeeTaskCard', start)
              portal = portal[:start] + portal[end:]
          if '  const observer=new MutationObserver' in portal:
              observer_start = portal.index('  const observer=new MutationObserver')
              assign_start = portal.index('  Object.assign(window,{', observer_start)
              portal = portal[:observer_start] + portal[assign_start:]
          portal = portal.replace('Object.assign(window,{renderUnifiedLogin,portalPasswordLogin,portalStartInstruction,portalRequestAppointment,portalDownloadProof,portalCloseLearning,portalLearningNext,portalLearningPrev,portalSubmitTraining,portalOpenOriginal,portalZoomLearningImage,portalSaveLearningStep,portalToggleLearningStep,portalSaveDelivery});', 'Object.assign(window,{portalStartInstruction,portalRequestAppointment,portalDownloadProof,portalCloseLearning,portalLearningNext,portalLearningPrev,portalSubmitTraining,portalOpenOriginal,portalZoomLearningImage,portalSaveLearningStep,portalToggleLearningStep,portalSaveDelivery});')
          for forbidden in ['function renderUnifiedLogin', 'function portalPasswordLogin', 'function portalLogout', 'const observer=new MutationObserver']:
              if forbidden in portal:
                  raise SystemExit(f'legacy portal auth remains: {forbidden}')
          portal_path.write_text(portal, encoding='utf-8')

          index_path = root / 'frontend/index.html'
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(r'\s*<a class="btn ghost login-action" href="/\.auth/login/aad">[^<]*</a>', '', html, count=1)
          if '/auth-login-v42.js' not in html:
              needle = '  <script src="/config.js"></script>\n  <script src="/app.js"></script>'
              if needle not in html:
                  raise SystemExit('index script insertion point missing')
              html = html.replace(needle, '  <script src="/config.js"></script>\n  <script src="/auth-login-v42.js"></script>\n  <script src="/app.js"></script>', 1)
          if html.index('/auth-login-v42.js') > html.index('/app.js'):
              raise SystemExit('auth login must load before app')
          index_path.write_text(html, encoding='utf-8')

          package_path = root / 'package.json'
          package = package_path.read_text(encoding='utf-8')
          if 'tests/unified-login-shell-v42.test.js' not in package:
              needle = 'tests/tenant-isolation-login-v40.test.js'
              if needle not in package:
                  raise SystemExit('package pretest insertion point missing')
              package = package.replace(needle, needle + ' tests/unified-login-shell-v42.test.js', 1)
          package_path.write_text(package, encoding='utf-8')
          PY

            cd "$dir"
            node --check frontend/auth-login-v42.js
            node --check frontend/app.js
            node --check frontend/employee-portal-v37.js
            npm ci
            npm ci --omit=dev --prefix api
            npm test

            git status --short
            unexpected="$(git status --short | grep -Ev '^( M|M |A |\?\?) (frontend/app.js|frontend/auth-login-v42.js|frontend/employee-portal-v37.js|frontend/index.html|tests/unified-login-shell-v42.test.js|tests/employee-portal-contract.test.js|package.json)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected changes on $branch:"
              echo "$unexpected"
              exit 1
            fi
            git add frontend/app.js frontend/auth-login-v42.js frontend/employee-portal-v37.js frontend/index.html tests/unified-login-shell-v42.test.js tests/employee-portal-contract.test.js package.json
            git commit -m "sync(${slug}): adopt verified unified login shell"
            git push origin "HEAD:$branch"
            cd "$SOURCE"
            git worktree remove --force "$dir"
          }

          sync_branch company/essentra-components essentra
          sync_branch company/kontur-werkzeugstahl kontur

      - name: Remove one-time workflow from RC991
        run: |
          git rm .github/workflows/rc991-sync-login-companies-once.yml
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"
          git commit -m "chore(rc991): remove completed company login sync job"
          git push origin HEAD:rc991-unified-learning-portal
