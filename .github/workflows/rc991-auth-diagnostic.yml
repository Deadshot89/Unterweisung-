name: RC991 Auth Diagnostic

on:
  push:
    branches:
      - rc991-unified-learning-portal
    paths:
      - .github/workflows/rc991-auth-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --prefix api --omit=dev
      - name: Read auth state without mutation
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { getPool, sql } from './api/src/lib/db.js';
          const candidate='tobiaslimberg89@gmail.com';
          const mask=(email)=>{const [local='',domain='']=String(email||'').split('@');return `${local.slice(0,1)}***@${domain}`;};
          const hash=(email)=>createHash('sha256').update(String(email||'').trim().toLowerCase()).digest('hex').slice(0,12);
          let pool;
          try {
            pool=await getPool();
            const schema=await pool.request().query(`SELECT
              COL_LENGTH('dbo.Users','passwordHash') AS passwordHashColumn,
              COL_LENGTH('dbo.Users','sessionVersion') AS sessionVersionColumn,
              COL_LENGTH('dbo.Users','passwordSetAt') AS passwordSetAtColumn`);
            const exact=await pool.request().input('email',sql.NVarChar(254),candidate)
              .query(`SELECT id,companyId,email,displayName,role,active,provider
                FROM dbo.Users WHERE LOWER(LTRIM(RTRIM(email)))=LOWER(@email)`);
            const named=await pool.request().input('name',sql.NVarChar(200),'%Tobias%')
              .query(`SELECT TOP 20 id,companyId,email,displayName,role,active,provider FROM dbo.Users
                WHERE displayName LIKE @name ORDER BY companyId,displayName`);
            const admins=await pool.request().query(`SELECT companyId,email,displayName,role,active,provider FROM dbo.Users
                WHERE role='system_admin' ORDER BY companyId,displayName`);
            console.log(JSON.stringify({
              schemaReady: schema.recordset[0]?.passwordHashColumn!=null && schema.recordset[0]?.sessionVersionColumn!=null,
              exactCandidate: exact.recordset.map(r=>({companyId:r.companyId,displayName:r.displayName,role:r.role,active:!!r.active,provider:r.provider,emailHash:hash(r.email)})),
              tobiasMatches: named.recordset.map(r=>({companyId:r.companyId,displayName:r.displayName,role:r.role,active:!!r.active,provider:r.provider,emailMasked:mask(r.email),emailHash:hash(r.email)})),
              systemAdmins: admins.recordset.map(r=>({companyId:r.companyId,displayName:r.displayName,active:!!r.active,provider:r.provider,emailMasked:mask(r.email),emailHash:hash(r.email)}))
            },null,2));
          } finally { if(pool) await pool.close(); }
          NODE
