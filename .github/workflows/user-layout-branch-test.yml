name: Benutzerlayout Branch-Test

on:
  push:
    branches:
      - fix-user-table-nav-focus

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Vollstaendige Tests ausfuehren
        run: npm test
