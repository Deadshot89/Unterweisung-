name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: static-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Install API dependencies for checks
        working-directory: api
        run: npm install --omit=dev

      - name: Run frontend/API syntax checks
        run: npm test

      - name: Repair confirmed Essentra administrator access once
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.36-instruction-ui' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          ACCESS_REPAIR_EMAIL: UnterweisungManagment@outlook.de
          ACCESS_REPAIR_COMPANY_ID: company-essentra
          ACCESS_REPAIR_DISPLAY_NAME: Tobias Limberg
        run: |
          node scripts/repair-confirmed-admin-access.js --dry-run
          node scripts/repair-confirmed-admin-access.js --apply

      - name: Diagnose current preview before deployment
        if: github.event_name == 'pull_request' && github.event.number == 1
        run: |
          status="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /tmp/preview-health.json --write-out '%{http_code}' https://delightful-sky-05dbf7603-1.westeurope.7.azurestaticapps.net/api/health || true)"
          echo "Previous preview health HTTP: $status"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          try {
            const d = JSON.parse(readFileSync('/tmp/preview-health.json', 'utf8'));
            const state = v => /^ok(?::|$)/.test(v || '') ? 'ok' : v === 'not_configured' ? v : 'unavailable';
            console.log(JSON.stringify({ ok: d.ok, database: state(d.database), blobStorage: state(d.blobStorage) }));
          } catch { console.log('Previous preview did not return JSON health data.'); }
          NODE

      - name: Diagnose Azure configuration bridge
        env:
          SQL_SECRET_PRESENT: ${{ secrets.SQL_CONNECTION_STRING != '' }}
          STORAGE_SECRET_PRESENT: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING != '' }}
          SWA_TOKEN_PRESENT: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
          FUNCTION_PROFILE_PRESENT: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE != '' }}
          AZURE_CREDENTIALS_PRESENT: ${{ secrets.AZURE_CREDENTIALS != '' }}
          AZURE_CLIENT_ID_SECRET_PRESENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          AZURE_TENANT_ID_SECRET_PRESENT: ${{ secrets.AZURE_TENANT_ID != '' }}
          AZURE_SUBSCRIPTION_ID_SECRET_PRESENT: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
          AZURE_CLIENT_ID_VAR_PRESENT: ${{ vars.AZURE_CLIENT_ID != '' }}
          AZURE_TENANT_ID_VAR_PRESENT: ${{ vars.AZURE_TENANT_ID != '' }}
          AZURE_SUBSCRIPTION_ID_VAR_PRESENT: ${{ vars.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          echo "SQL_CONNECTION_STRING secret present: $SQL_SECRET_PRESENT"
          echo "AZURE_STORAGE_CONNECTION_STRING secret present: $STORAGE_SECRET_PRESENT"
          echo "SWA deployment token present: $SWA_TOKEN_PRESENT"
          echo "Function publish profile present: $FUNCTION_PROFILE_PRESENT"
          echo "AZURE_CREDENTIALS present: $AZURE_CREDENTIALS_PRESENT"
          echo "AZURE_CLIENT_ID secret present: $AZURE_CLIENT_ID_SECRET_PRESENT"
          echo "AZURE_TENANT_ID secret present: $AZURE_TENANT_ID_SECRET_PRESENT"
          echo "AZURE_SUBSCRIPTION_ID secret present: $AZURE_SUBSCRIPTION_ID_SECRET_PRESENT"
          echo "AZURE_CLIENT_ID repository variable present: $AZURE_CLIENT_ID_VAR_PRESENT"
          echo "AZURE_TENANT_ID repository variable present: $AZURE_TENANT_ID_VAR_PRESENT"
          echo "AZURE_SUBSCRIPTION_ID repository variable present: $AZURE_SUBSCRIPTION_ID_VAR_PRESENT"

      - name: Diagnose existing Function App
        env:
          FUNCTION_APP_URL: https://func-unterweisungsmanager-dev-hkf6czbjd5h0hthq.germanywestcentral-01.azurewebsites.net
        run: |
          echo "Checking standalone Function App health..."
          health_status="$(curl --connect-timeout 10 --max-time 20 --silent --show-error --output /tmp/function-health.txt --write-out '%{http_code}' "$FUNCTION_APP_URL/api/health" || true)"
          echo "Standalone /api/health returned HTTP ${health_status:-curl_error}"
          if [ "$health_status" = "200" ] && [ -s /tmp/function-health.txt ]; then
            HEALTH_JSON="$(cat /tmp/function-health.txt)" node -e "const d=JSON.parse(process.env.HEALTH_JSON); console.log(JSON.stringify({ok:d.ok,service:d.service,database:d.database,blobStorage:d.blobStorage}));"
          elif [ -s /tmp/function-health.txt ]; then
            echo "Standalone health body received but not HTTP 200"
          fi

          me_status="$(curl --connect-timeout 10 --max-time 20 --silent --show-error --output /tmp/function-me.txt --write-out '%{http_code}' "$FUNCTION_APP_URL/api/me" || true)"
          echo "Standalone /api/me without SWA identity returned HTTP ${me_status:-curl_error}"
          if [ -s /tmp/function-me.txt ]; then
            node -e "const fs=require('fs'); const t=fs.readFileSync('/tmp/function-me.txt','utf8'); try { const d=JSON.parse(t); console.log(JSON.stringify({error:d.error||d.message||null, authenticated:d.authenticated??null})); } catch { console.log('Standalone /api/me returned non-JSON body'); }"
          fi

      - name: Prepare managed API runtime settings
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: node scripts/prepare-managed-api-settings.js

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          api_location: "api"
          output_location: ""
          skip_app_build: true

      - name: Remove generated runtime settings
        if: always()
        # The Azure Docker action can leave the API directory owned by root.
        run: |
          if [ -f api/runtime-settings.deploy.json ]; then
            stat --format='Packaged settings permissions: %a; owner UID: %u; group GID: %g' api/runtime-settings.deploy.json
            if [ -r api/runtime-settings.deploy.json ]; then echo 'Runner can read packaged settings'; else echo 'Runner cannot read packaged settings'; fi
          fi
          sudo rm -f -- api/runtime-settings.deploy.json

      - name: Diagnose deployed API health
        if: steps.builddeploy.outputs.static_web_app_url != ''
        env:
          STATIC_WEB_APP_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          echo "Checking integrated API health at deployed preview..."
          health="$(curl --connect-timeout 10 --max-time 30 --fail --silent --show-error "$STATIC_WEB_APP_URL/api/health")"
          HEALTH_JSON="$health" node -e "const d=JSON.parse(process.env.HEALTH_JSON); const database=d.database==='ok'; const blobStorage=/^ok(?::|$)/.test(d.blobStorage||''); console.log(JSON.stringify({ok:d.ok,database:database?'ok':'unavailable',blobStorage:blobStorage?'ok':'unavailable'})); if(!d.ok||!database||!blobStorage) process.exit(1);"

      - name: Verify deployed stylesheets
        if: steps.builddeploy.outputs.static_web_app_url != ''
        env:
          STATIC_WEB_APP_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const index = readFileSync('frontend/index.html', 'utf8');
          const paths = [...index.matchAll(/<link\b[^>]*rel="stylesheet"[^>]*href="([^"]+)"/g)].map(m => m[1]);
          assert.ok(paths.length > 0, 'No stylesheet references found');
          for (const path of paths) {
            const response = await fetch(new URL(path, process.env.STATIC_WEB_APP_URL), { redirect: 'manual', signal: AbortSignal.timeout(30000) });
            assert.equal(response.status, 200, `Stylesheet unavailable: ${path}`);
            assert.match(response.headers.get('content-type') || '', /^text\/css\b/i, `Stylesheet redirected or wrong MIME type: ${path}`);
            assert.equal((await response.text()).replace(/\r\n/g, '\n'), readFileSync(`frontend${path}`, 'utf8').replace(/\r\n/g, '\n'), `Unexpected stylesheet content: ${path}`);
            console.log(`Stylesheet verified: ${path}`);
          }
          NODE

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
