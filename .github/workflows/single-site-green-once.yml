name: Single Site Green Once

on:
  push:
    branches:
      - hotfix-single-canonical-site
    paths:
      - .github/workflows/single-site-green-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-single-canonical-site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal central-site fix
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path('frontend/config.js')
          config.write_text("""// Unterweisungsmanager Online - zentrale Produktionskonfiguration\n// Browser und Managed API laufen auf demselben Origin. Keine Firma wird vor der Anmeldung vorbelegt.\nwindow.UM_API_BASE_URL = '';\nwindow.UM_DEFAULT_COMPANY_ID = '';\nwindow.UM_CANONICAL_ORIGIN = 'https://delightful-sky-05dbf7603.7.azurestaticapps.net';\n""", encoding='utf-8')
          app = Path('frontend/app.js')
          text = app.read_text(encoding='utf-8')
          old = "const DEFAULT_COMPANY_ID = window.UM_DEFAULT_COMPANY_ID || 'company-essentra';"
          new = "const DEFAULT_COMPANY_ID = window.UM_DEFAULT_COMPANY_ID || '';"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one default-company line, found {text.count(old)}')
          app.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: npm install
      - name: Focused GREEN contract
        run: node --test tests/login-gate-hotfix.test.js
      - name: Full regression
        run: npm test
      - name: Commit verified product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/config.js frontend/app.js
          git commit -m 'fix(site): use one same-origin central application'
          git push origin HEAD:hotfix-single-canonical-site
