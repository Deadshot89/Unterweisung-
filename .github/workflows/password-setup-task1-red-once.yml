name: Password Setup Task 1 Contract Once

on:
  push:
    branches: [auth-password-setup-links]
    paths:
      - .github/workflows/password-setup-task1-red-once.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Task 1 contract
        run: node --test tests/password-setup-token-contract.test.js
