name: Diagnose-App eigener Login

on:
  push:
    branches:
      - fix-diagnostics-own-login

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Diagnose-Login-Test
        run: node --test tests/diagnostics-own-login.test.js
