name: Login-SQL-Warmup Test

on:
  push:
    branches:
      - fix-login-sql-cold-start

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Gesamttests
        run: npm test
