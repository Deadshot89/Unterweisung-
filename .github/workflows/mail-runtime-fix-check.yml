name: Mail-Runtime-Fix prüfen

on:
  push:
    branches:
      - fix-diagnostics-mail-runtime

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm install
      - name: API-Abhängigkeiten installieren
        working-directory: api
        run: npm install --omit=dev
      - name: Vollständige Testsuite
        run: npm test
