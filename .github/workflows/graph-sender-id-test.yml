name: Graph Sender ID prüfen

on:
  push:
    branches:
      - fix-graph-sender-id

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RED/GREEN Graph Sender ID
        run: node --test tests/graph-sender-id.test.js
