name: Check Retired SWA Secret Once

on:
  push:
    branches:
      - ops-retire-old-static-site
    paths:
      - .github/workflows/check-retired-swa-secret-once.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secret presence only
        env:
          OLD_HOST_TOKEN_PRESENT: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_SKY_05DB7F603 != '' }}
          CURRENT_NAMED_TOKEN_PRESENT: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_SKY_05DBF7603 != '' }}
          GENERIC_TOKEN_PRESENT: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        run: |
          echo "Old host token present: $OLD_HOST_TOKEN_PRESENT"
          echo "Current named token present: $CURRENT_NAMED_TOKEN_PRESENT"
          echo "Generic token present: $GENERIC_TOKEN_PRESENT"
