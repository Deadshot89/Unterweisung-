name: Seed Unterweisungsmanager Database

on:
  push:
    branches:
      - main
    paths:
      - "operations/data-import-request.json"

permissions:
  contents: read

concurrency:
  group: seed-database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Validate explicit import request (no database access)
    outputs:
      approved: ${{ steps.request.outputs.approved }}
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate request before exposing database credentials
        id: request
        run: node .github/scripts/authorize-data-import.cjs

  seed:
    needs: authorize
    if: needs.authorize.outputs.approved == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Import start data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Install API dependencies
        working-directory: api
        run: npm install --omit=dev

      - name: Run migrations
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: npm run db:migrate

      - name: Import start data
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: npm run db:seed

      - name: Upload templates to blob storage
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          BLOB_CONTAINER_TEMPLATES: templates
        run: npm run blob:upload-templates
