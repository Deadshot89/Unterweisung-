name: One-time password bootstrap

on:
  push:
    branches:
      - ops-password-bootstrap-20260905
    paths:
      - ".github/workflows/seed-database.yml"

permissions:
  contents: read

concurrency:
  group: one-time-password-bootstrap
  cancel-in-progress: false

jobs:
  migrate-and-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact ops revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Run additive database migrations
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: npm run db:migrate

      - name: Seed operator initial password setup hash
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          PASSWORD_SETUP_TOKEN_HASH: 685d455d367b9d65c7cf5cbef5fcd0ae49e30dc3bd6ad88dedcc43890b45ab54
        run: npm run auth:seed-initial-setup
