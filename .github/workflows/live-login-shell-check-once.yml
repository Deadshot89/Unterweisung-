name: Live Login Shell Check Once

on:
  push:
    branches:
      - hotfix-login-shell-only
    paths:
      - .github/workflows/live-login-shell-check-once.yml

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production anonymous shell assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://delightful-sky-05dbf7603.7.azurestaticapps.net'
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$BASE/" -o /tmp/index.html
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$BASE/login-gate-v44.css" -o /tmp/login.css
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$BASE/app.js" -o /tmp/app.js

          grep -F '<body class="auth-pending">' /tmp/index.html
          grep -E 'id="portalNavigation"[^>]*hidden' /tmp/index.html
          grep -F 'body.auth-pending .system-strip,body.auth-pending .primary-tabs,body.auth-pending .view,body.auth-pending .app-footer-v35{display:none!important}' /tmp/login.css
          grep -F 'body.auth-pending main.pro-shell-grid{display:block!important;max-width:1180px}' /tmp/login.css
          grep -F 'body.auth-pending #companySelectionGate{display:block!important}' /tmp/login.css
          grep -F 'if(!state.me || isAuthenticationError(err)) renderAuthenticationRequired(err.message||err);' /tmp/app.js

          status="$(curl --silent --show-error --output /tmp/me.txt --write-out '%{http_code}' --retry 4 --retry-delay 2 "$BASE/api/me" || true)"
          echo "Anonymous /api/me HTTP status: $status"
          cat /tmp/me.txt || true
          case "$status" in
            401|403) ;;
            *) echo "Expected anonymous /api/me to reject with 401/403, got $status" >&2; exit 1;;
          esac

          if grep -q 'Essentra Übersicht' /tmp/index.html; then
            echo 'Note: Essentra markup exists in source HTML but is protected by auth-pending display rules.'
          fi
          echo 'LIVE_LOGIN_SHELL_OK'