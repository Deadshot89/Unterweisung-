name: Apply password setup session fix

on:
  push:
    branches:
      - fix-password-setup-session-precedence
    paths:
      - .github/workflows/apply-password-setup-session-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-password-setup-session-precedence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard initial session lookup during password setup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/app.js';
          const before = fs.readFileSync(path, 'utf8');
          const oldStartup = "document.getElementById('companySwitchAction')?.addEventListener('click', leaveCompanyContext);\nrenderAuthenticationRequired();\nloadData();";
          const newStartup = "document.getElementById('companySwitchAction')?.addEventListener('click', leaveCompanyContext);\nrenderAuthenticationRequired();\nif(!UMAuthLogin.hasPasswordSetupToken()) loadData();";
          if (!before.includes(oldStartup)) {
            throw new Error('Erwarteter Startblock in frontend/app.js wurde nicht gefunden.');
          }
          const after = before.replace(oldStartup, newStartup);
          if (after === before) throw new Error('frontend/app.js wurde nicht geändert.');
          fs.writeFileSync(path, after);
          NODE
      - name: Install root dependencies
        run: npm install
      - name: Install API dependencies
        working-directory: api
        run: npm install --omit=dev
      - name: Run complete test suite
        run: npm test
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js
          git commit -m "fix(auth): prioritize password setup over existing session"
          git push origin HEAD:fix-password-setup-session-precedence
