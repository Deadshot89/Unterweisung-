name: Login-Performance aktueller Main

on:
  push:
    branches:
      - fix-login-performance-current

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-login-performance-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Geprüften Login-Fix auf aktuellen Main übernehmen
        run: |
          git fetch origin fix-login-performance
          git checkout origin/fix-login-performance -- frontend/app.js frontend/auth-login-v42.js package.json tests/login-performance.test.js
          if ! git diff --cached --quiet -- frontend/app.js frontend/auth-login-v42.js package.json tests/login-performance.test.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: Anmeldung auf aktuellem main beschleunigen"
            git push origin HEAD:fix-login-performance-current
          fi
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Vollständige Tests
        run: npm test
