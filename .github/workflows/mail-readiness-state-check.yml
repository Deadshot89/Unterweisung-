name: E-Mail-Bereitschaftsstatus prüfen

on:
  push:
    branches:
      - fix-diagnostics-mail-readiness-state

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bereitschaftsstatus minimal korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          api_path = Path('api/src/functions/diagnostics.js')
          api = api_path.read_text(encoding='utf-8')
          marker = "\nfunction endpointHash(endpoint) {"
          helper = """

          async function emailDeliveryStatus(pool) {
            const result = await pool.request().query(`
              SELECT TOP 20 alertResultJson,alertedAt
              FROM DiagnosticEvents
              WHERE alertResultJson IS NOT NULL
                AND alertedAt IS NOT NULL
              ORDER BY alertedAt DESC,id DESC`);
            for (const row of result.recordset) {
              try {
                const alertResult = JSON.parse(row.alertResultJson);
                if (typeof alertResult?.email?.sent === 'boolean') {
                  return {
                    deliveryVerified: alertResult.email.sent,
                    lastDeliveryAttemptAt: row.alertedAt || null
                  };
                }
              } catch {
                // Ungültige Altwerte überspringen; keine Diagnosedetails nach außen geben.
              }
            }
            return { deliveryVerified: null, lastDeliveryAttemptAt: null };
          }
          """
          if 'async function emailDeliveryStatus(pool)' not in api:
              if marker not in api:
                  raise SystemExit('API-Anker für Zustellstatus nicht gefunden')
              api = api.replace(marker, helper + marker, 1)

          old_source = "      const row = counts.recordset[0] || {};\n      const alertStatus = alertRuntimeStatus();\n      return json({\n"
          new_source = "      const row = counts.recordset[0] || {};\n      const alertStatus = alertRuntimeStatus();\n      const emailDelivery = await emailDeliveryStatus(pool);\n      const emailReady = !!alertStatus.emailConfigured && emailDelivery.deliveryVerified === true;\n      return json({\n"
          if 'const emailDelivery = await emailDeliveryStatus(pool);' not in api:
              if old_source not in api:
                  raise SystemExit('API-Anker Statusaufbau nicht gefunden')
              api = api.replace(old_source, new_source, 1)

          pattern = re.compile(
              r"(?P<i>\s*)email:\s*\{\s*\n"
              r"(?P=i)\s{2}configured:\s*alertStatus\.emailConfigured,\s*\n"
              r"(?P=i)\s{2}provider:\s*alertStatus\.emailProvider,\s*\n"
              r"(?P=i)\s{2}missing:\s*alertStatus\.emailMissing\s*\n"
              r"(?P=i)\}",
              re.MULTILINE,
          )
          replacement = (
              "          email: {\n"
              "            configured: alertStatus.emailConfigured,\n"
              "            deliveryVerified: emailDelivery.deliveryVerified,\n"
              "            ready: emailReady,\n"
              "            lastDeliveryAttemptAt: emailDelivery.lastDeliveryAttemptAt,\n"
              "            provider: alertStatus.emailProvider,\n"
              "            missing: alertStatus.emailMissing\n"
              "          }"
          )
          if 'deliveryVerified: emailDelivery.deliveryVerified' not in api:
              api, count = pattern.subn(replacement, api, count=1)
              if count != 1:
                  raise SystemExit(f'API-E-Mail-Statusblock nicht eindeutig gefunden: {count}')
          api_path.write_text(api, encoding='utf-8')

          app_path = Path('frontend/diagnostics-app.js')
          app = app_path.read_text(encoding='utf-8')
          old_line = "    $('statusEmail').textContent = status?.alerts?.email?.configured ? 'BEREIT' : 'NICHT BEREIT';"
          new_block = """    $('statusEmail').textContent = status?.alerts?.email?.ready
              ? 'BEREIT'
              : status?.alerts?.email?.deliveryVerified === false
                ? 'NICHT BEREIT · LETZTER VERSAND FEHLGESCHLAGEN'
                : status?.alerts?.email?.configured
                  ? 'NICHT BEREIT · VERSAND NICHT BESTÄTIGT'
                  : 'NICHT BEREIT';"""
          new_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_block.splitlines())
          if 'status?.alerts?.email?.ready' not in app:
              if old_line not in app:
                  raise SystemExit('Frontend-Anker E-Mail-Status nicht gefunden')
              app = app.replace(old_line, new_block, 1)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Abhängigkeiten installieren
        run: npm install
      - name: API-Abhängigkeiten installieren
        working-directory: api
        run: npm install --omit=dev
      - name: Vollständige Testsuite
        run: npm test

      - name: Geprüfte Produktänderung committen
        run: |
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"
          git add api/src/functions/diagnostics.js frontend/diagnostics-app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: E-Mail-Bereitschaft erst nach Zustellung melden"
          git push origin HEAD:fix-diagnostics-mail-readiness-state
