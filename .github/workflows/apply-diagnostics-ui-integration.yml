name: Diagnose-UI einmalig integrieren

on:
  push:
    branches:
      - feature-diagnostics-pwa
    paths:
      - scripts/apply-diagnostics-ui-integration.mjs
      - .github/workflows/apply-diagnostics-ui-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-diagnostics-pwa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose-UI integrieren
        run: node scripts/apply-diagnostics-ui-integration.mjs
      - name: Hilfsdateien entfernen
        run: |
          rm scripts/apply-diagnostics-ui-integration.mjs
          rm .github/workflows/apply-diagnostics-ui-integration.yml
      - name: Produktänderungen committen
        run: |
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"
          git add frontend/app.js frontend/index.html frontend/role-guard-v20.js frontend/user-management-v19.js frontend/diagnostics-entry-v37.js scripts/apply-diagnostics-ui-integration.mjs .github/workflows/apply-diagnostics-ui-integration.yml
          git commit -m "feat: integrate diagnostics into main application"
          git push origin HEAD:feature-diagnostics-pwa
