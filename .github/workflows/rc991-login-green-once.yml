name: RC991 Apply Unified Login GREEN Once

on:
  push:
    branches:
      - rc991-unified-learning-portal
    paths:
      - '.github/workflows/rc991-login-green-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC991 branch
        uses: actions/checkout@v4
        with:
          ref: rc991-unified-learning-portal
          fetch-depth: 0

      - name: Replace legacy login ownership with shared shell
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/app.js')
          app = app_path.read_text(encoding='utf-8')
          start = app.index("function renderAuthenticationRequired(message=''){")
          end = app.index("\n\nfunction renderServiceUnavailable", start)
          replacement = """function renderAuthenticationRequired(message=''){
            state.apiAvailable = false;
            state.data = null;
            state.statusRows = [];
            state.users = [];
            state.companyId = null;
            setCoreWorkspaceVisible(false);
            const gate = $('companySelectionGate');
            if(gate) UMAuthLogin.render({target:gate,message});
            renderUserInfo(false);
            if(typeof updateCompanyShell === 'function') updateCompanyShell(null);
          }"""
          app = app[:start] + replacement + app[end:]
          old_logout = '<a class="btn ghost" href="/.auth/logout">Abmelden</a>'
          if app.count(old_logout) != 1:
              raise SystemExit(f'Expected exactly one dynamic service logout, found {app.count(old_logout)}')
          app = app.replace(old_logout, '<a class="btn ghost logout-action" href="/.auth/logout">Abmelden</a>', 1)
          if 'UMAuthLogin.render' not in app:
              raise SystemExit('Shared login render wiring missing after replacement')
          if 'Anmeldung erforderlich</h2>' in app or 'Sitzung abmelden' in app:
              raise SystemExit('Legacy Microsoft-only login markup still present in app.js')
          app_path.write_text(app, encoding='utf-8')

          portal_path = Path('frontend/employee-portal-v37.js')
          portal = portal_path.read_text(encoding='utf-8')
          portal = portal.replace('// v0.36.3 Mitarbeiterportal, Dual-Login und bildgestützte Lernschritte.', '// v0.36.3 Mitarbeiterportal und bildgestützte Lernschritte.', 1)
          start = portal.index("  function renderUnifiedLogin(errorText=''){")
          end = portal.index('  function employeeTaskCard', start)
          portal = portal[:start] + portal[end:]
          observer_start = portal.index('  const observer=new MutationObserver')
          assign_start = portal.index('  Object.assign(window,{', observer_start)
          portal = portal[:observer_start] + portal[assign_start:]
          old_assign = 'Object.assign(window,{renderUnifiedLogin,portalPasswordLogin,portalStartInstruction,portalRequestAppointment,portalDownloadProof,portalCloseLearning,portalLearningNext,portalLearningPrev,portalSubmitTraining,portalOpenOriginal,portalZoomLearningImage,portalSaveLearningStep,portalToggleLearningStep,portalSaveDelivery});'
          new_assign = 'Object.assign(window,{portalStartInstruction,portalRequestAppointment,portalDownloadProof,portalCloseLearning,portalLearningNext,portalLearningPrev,portalSubmitTraining,portalOpenOriginal,portalZoomLearningImage,portalSaveLearningStep,portalToggleLearningStep,portalSaveDelivery});'
          if old_assign not in portal:
              raise SystemExit('Expected portal export list not found')
          portal = portal.replace(old_assign, new_assign, 1)
          for forbidden in ['function renderUnifiedLogin', 'function portalPasswordLogin', 'function portalLogout', 'const observer=new MutationObserver']:
              if forbidden in portal:
                  raise SystemExit(f'Legacy portal login ownership remains: {forbidden}')
          portal_path.write_text(portal, encoding='utf-8')

          login_path = Path('frontend/auth-login-v42.js')
          login = login_path.read_text(encoding='utf-8')
          old = """  function bindLogout(){document.querySelector('.logout-action')?.addEventListener('click',logout);}
            document.addEventListener('DOMContentLoaded',bindLogout);
            bindLogout();
            root.UMAuthLogin=Object.freeze({render,passwordLogin,logout});"""
          new = """  document.addEventListener('click',event=>{if(event.target?.closest?.('.logout-action'))logout(event);});
            root.UMAuthLogin=Object.freeze({render,passwordLogin,logout});"""
          if old not in login:
              raise SystemExit('Expected shared logout binding not found')
          login = login.replace(old, new, 1)
          login_path.write_text(login, encoding='utf-8')
          PY

      - name: Verify focused login contracts before commit
        run: |
          node --check frontend/auth-login-v42.js
          node --check frontend/app.js
          node --check frontend/employee-portal-v37.js
          node --test tests/unified-login-shell-v42.test.js tests/employee-portal-contract.test.js tests/tenant-isolation-login-v40.test.js tests/system-admin-company-selection.test.js

      - name: Commit GREEN implementation and remove one-time workflow
        run: |
          git rm .github/workflows/rc991-login-green-once.yml
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"
          git add frontend/app.js frontend/auth-login-v42.js frontend/employee-portal-v37.js
          git commit -m "feat(rc991): unify pre-auth login shell"
          git push origin HEAD:rc991-unified-learning-portal
