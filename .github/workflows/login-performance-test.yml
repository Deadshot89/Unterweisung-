name: Login-Performance-Test

on:
  push:
    branches:
      - fix-login-performance

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Vollständige Tests
        run: npm test
