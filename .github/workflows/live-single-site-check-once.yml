name: Live Single Site Check Once

on:
  push:
    branches:
      - hotfix-single-canonical-site
    paths:
      - .github/workflows/live-single-site-check-once.yml

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical production and retired host
        shell: bash
        run: |
          set -euo pipefail
          CANON='https://delightful-sky-05dbf7603.7.azurestaticapps.net'
          OLD='https://delightful-sky-05db7f603.7.azurestaticapps.net'

          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$CANON/config.js" -o /tmp/config.js
          grep -F "window.UM_API_BASE_URL = '';" /tmp/config.js
          grep -F "window.UM_DEFAULT_COMPANY_ID = '';" /tmp/config.js
          grep -F "window.UM_CANONICAL_ORIGIN = '$CANON';" /tmp/config.js
          ! grep -Fi 'azurewebsites.net' /tmp/config.js
          ! grep -Fi 'company-essentra' /tmp/config.js

          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$CANON/" -o /tmp/index.html
          grep -F '<body class="auth-pending">' /tmp/index.html

          status="$(curl --silent --show-error --output /tmp/me.txt --write-out '%{http_code}' --retry 4 --retry-delay 2 "$CANON/api/me" || true)"
          echo "Canonical anonymous /api/me: $status"
          cat /tmp/me.txt || true
          test "$status" = '401'

          old_status="$(curl --silent --show-error --output /tmp/old.txt --write-out '%{http_code}' --max-time 30 "$OLD/" || true)"
          echo "Retired host /: $old_status"
          test "$old_status" = '404'

          echo 'LIVE_SINGLE_CANONICAL_SITE_OK'
