name: Single Site Host Diagnostic

on:
  push:
    branches:
      - hotfix-single-canonical-site
    paths:
      - .github/workflows/single-site-host-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare old and canonical Azure hosts
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://delightful-sky-05db7f603.7.azurestaticapps.net'
          CANON='https://delightful-sky-05dbf7603.7.azurestaticapps.net'
          for label in OLD CANON; do
            base="${!label}"
            echo "===== $label $base ====="
            for path in / /.auth/me /api/me; do
              echo "--- $path ---"
              curl -sS -D "/tmp/${label}.headers" -o "/tmp/${label}.body" --max-time 30 "$base$path" || true
              awk 'NR<=20{print}' "/tmp/${label}.headers" || true
              echo "BODY_SHA256 $(sha256sum "/tmp/${label}.body" 2>/dev/null | cut -d' ' -f1 || true)"
              head -c 1000 "/tmp/${label}.body" || true
              echo
            done
          done
