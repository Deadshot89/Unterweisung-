name: RC991 Session Secret Contract

on:
  push:
    branches:
      - rc991-unified-learning-portal
    paths:
      - .github/workflows/rc991-session-secret-red.yml
      - scripts/check-managed-api-runtime-settings.js
      - scripts/prepare-managed-api-settings.js
      - api/src/lib/runtime-settings.js
      - .github/workflows/azure-static-web-apps.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/check-managed-api-runtime-settings.js
