name: Hotfix Login Shell Apply Once

on:
  push:
    branches:
      - hotfix-login-shell-only
    paths:
      - .github/workflows/hotfix-login-shell-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-login-shell-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch initial authentication fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/app.js')
          source = path.read_text(encoding='utf-8')
          old = """  }catch(err){
            if(isAuthenticationError(err)) renderAuthenticationRequired(err.message||err);
            else renderServiceUnavailable(err.message||err);
          }
          }"""
          new = """  }catch(err){
            if(!state.me || isAuthenticationError(err)) renderAuthenticationRequired(err.message||err);
            else renderServiceUnavailable(err.message||err);
          }
          }"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one loadData catch block, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          npm install
          npm install --prefix api --omit=dev
      - name: Verify hotfix
        run: |
          node --check frontend/app.js
          npm test
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/hotfix-login-shell-apply-once.yml
          git add frontend/app.js
          git diff --cached --check
          git commit -m 'fix(login): keep unauthenticated startup on login shell'
          git push origin HEAD:hotfix-login-shell-only