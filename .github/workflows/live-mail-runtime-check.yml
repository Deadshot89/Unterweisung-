name: Live-Mail-Runtime prüfen

on:
  push:
    branches:
      - fix-diagnostics-mail-runtime

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Produktiven Mail-Status prüfen
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = 'https://delightful-sky-05dbf7603.7.azurestaticapps.net/api/mail/config';
          const response = await fetch(url, { signal: AbortSignal.timeout(30000), headers: { 'cache-control': 'no-cache' } });
          assert.equal(response.status, 200, `Mail-Status HTTP ${response.status}`);
          const status = await response.json();
          assert.equal(status.configured, true, `Mail nicht bereit; fehlend: ${(status.missing || []).join(', ')}`);
          assert.deepEqual(status.missing || [], []);
          assert.equal(status.provider, 'microsoft-graph');
          console.log('PRODUKTIVER_MAIL_STATUS: BEREIT');
          console.log('MAIL_PROVIDER: microsoft-graph');
          NODE
