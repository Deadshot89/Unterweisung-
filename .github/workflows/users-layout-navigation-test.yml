name: Benutzerlayout und Navigation prüfen

on:
  push:
    branches:
      - fix-users-layout-navigation-focus

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vollständige Tests
        run: npm test
