name: Hotfix Login Apply Once

on:
  push:
    branches:
      - hotfix-login-gate
    paths:
      - .github/workflows/hotfix-login-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-login-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch verified RC source
        run: git fetch origin rc991-unified-learning-portal
      - name: Prepare focused login hotfix
        run: |
          node scripts/hotfix-login-apply-once.js
          node -e "const fs=require('fs');const p='api/src/lib/auth.js';let s=fs.readFileSync(p,'utf8');const old='const selectedCompanyId=isDevSystemAdmin?(base.requestedCompanyId || null):defaultCompanyId();';if((s.split(old).length-1)!==1)throw new Error('dev company selection source mismatch');const replacement='const devCompanyId=base.requestedCompanyId || defaultCompanyId(); const selectedCompanyId=isDevSystemAdmin?(base.requestedCompanyId || null):devCompanyId;';fs.writeFileSync(p,s.replace(old,replacement));"
      - name: Install dependencies
        run: |
          npm install
          npm install --prefix api --omit=dev
      - name: Verify complete hotfix
        run: |
          node --check frontend/app.js
          node --check frontend/auth-login-v42.js
          npm test
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/hotfix-login-diagnostic.yml || true
          git add frontend/index.html frontend/app.js frontend/auth-login-v42.js frontend/login-gate-v44.css api/src/lib/auth.js api/src/lib/passwordAuth.js api/src/lib/runtime-settings.js api/src/lib/db.js api/src/functions/passwordAuth.js api/src/functions/me.js scripts/prepare-managed-api-settings.js .github/workflows/azure-static-web-apps.yml
          git diff --cached --check
          git commit -m 'fix(login): require central authentication before company data'
          git push origin HEAD:hotfix-login-gate
