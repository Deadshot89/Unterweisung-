name: Diagnose-Mail Absenderursache prüfen

on:
  push:
    branches:
      - verify-mail-sender-root-cause

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Absender und Microsoft-365-Zuordnung sicher prüfen
        env:
          FUNCTION_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { resolveMx } from 'node:dns/promises';

          const xml = String(process.env.FUNCTION_PUBLISH_PROFILE || '');
          if (!xml) throw new Error('Function-Publish-Profil fehlt.');
          const attr = (name) => xml.match(new RegExp(`${name}="([^"]*)"`, 'i'))?.[1] || '';
          const user = attr('userName');
          const password = attr('userPWD');
          const publishUrl = attr('publishUrl').replace(/^https?:\/\//i, '').replace(/\/$/, '');
          if (!user || !password || !publishUrl) throw new Error('Function-Publish-Profil konnte nicht ausgewertet werden.');

          const response = await fetch(`https://${publishUrl}/api/settings`, {
            headers: { authorization: `Basic ${Buffer.from(`${user}:${password}`).toString('base64')}` },
            signal: AbortSignal.timeout(30000)
          });
          assert.equal(response.status, 200, `Azure-App-Einstellungen HTTP ${response.status}`);
          const settings = await response.json();
          const names = ['GRAPH_TENANT_ID','GRAPH_CLIENT_ID','GRAPH_CLIENT_SECRET','MAIL_FROM'];
          for (const name of names) {
            const value = String(settings[name] || '').trim();
            assert.ok(value, `Azure-App-Einstellung ${name} fehlt.`);
            console.log(`::add-mask::${value}`);
            process.env[name] = value;
          }

          const mailFrom = process.env.MAIL_FROM;
          const emailMatch = mailFrom.match(/^[^\s@]+@([^\s@]+)$/);
          console.log(`MAIL_FROM_EINFACHE_EMAIL: ${emailMatch ? 'ja' : 'nein'}`);
          assert.ok(emailMatch, 'MAIL_FROM ist keine einfache E-Mail-/UPN-Kennung.');
          const domain = emailMatch[1].toLowerCase();
          console.log(`::add-mask::${domain}`);

          let provider = 'kein-mx';
          let mxCount = 0;
          try {
            const mx = await resolveMx(domain);
            mxCount = mx.length;
            const hosts = mx.map(entry => String(entry.exchange || '').toLowerCase());
            for (const host of hosts) console.log(`::add-mask::${host}`);
            if (hosts.some(host => host.includes('mail.protection.outlook.com') || host.endsWith('.outlook.com'))) provider = 'microsoft-365';
            else if (hosts.some(host => host.includes('google.com') || host.includes('googlemail.com'))) provider = 'google';
            else provider = 'anderer';
          } catch {
            provider = 'kein-mx';
          }
          console.log(`MAIL_MX_VORHANDEN: ${mxCount > 0 ? 'ja' : 'nein'}`);
          console.log(`MAIL_DOMAIN_PROVIDER: ${provider}`);

          const tokenBody = new URLSearchParams({
            client_id: process.env.GRAPH_CLIENT_ID,
            client_secret: process.env.GRAPH_CLIENT_SECRET,
            scope: 'https://graph.microsoft.com/.default',
            grant_type: 'client_credentials'
          });
          const tokenResponse = await fetch(`https://login.microsoftonline.com/${encodeURIComponent(process.env.GRAPH_TENANT_ID)}/oauth2/v2.0/token`, {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: tokenBody,
            signal: AbortSignal.timeout(30000)
          });
          assert.equal(tokenResponse.status, 200, `Tokenabruf HTTP ${tokenResponse.status}`);
          const token = String((await tokenResponse.json()).access_token || '');
          assert.ok(token, 'Kein Access-Token erhalten.');
          console.log(`::add-mask::${token}`);

          const resolveResponse = await fetch(`https://graph.microsoft.com/v1.0/users/${encodeURIComponent(mailFrom)}?$select=id,userPrincipalName,mail`, {
            headers: { authorization: `Bearer ${token}` },
            signal: AbortSignal.timeout(30000)
          });
          console.log(`GRAPH_ABSENDER_AUFLOESUNG_STATUS: ${resolveResponse.status}`);
          console.log(`GRAPH_ABSENDER_AUFLOESBAR: ${resolveResponse.status === 200 ? 'ja' : 'nicht-bestaetigt'}`);
          if (resolveResponse.status === 200) {
            const resolved = await resolveResponse.json();
            const id = String(resolved.id || '');
            const upn = String(resolved.userPrincipalName || '').trim();
            const mail = String(resolved.mail || '').trim();
            if (id) console.log(`::add-mask::${id}`);
            if (upn) console.log(`::add-mask::${upn}`);
            if (mail) console.log(`::add-mask::${mail}`);
            console.log(`GRAPH_UPN_GLEICH_MAIL_FROM: ${upn.toLowerCase() === mailFrom.toLowerCase() ? 'ja' : 'nein'}`);
            console.log(`GRAPH_MAIL_GLEICH_MAIL_FROM: ${mail.toLowerCase() === mailFrom.toLowerCase() ? 'ja' : 'nein'}`);
          } else {
            await resolveResponse.text();
          }

          console.log('TESTMAIL_GESENDET: nein');
          NODE
